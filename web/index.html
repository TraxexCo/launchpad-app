<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LaunchPad administrator operations console for verification, moderation, disputes, and classroom payment monitoring.">
  <meta name="theme-color" content="#101114">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LaunchPad Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LaunchPad Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #101114;
      color: #f6f3ea;
      color-scheme: dark;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (pointer: fine) {
      html { overscroll-behavior: none; }
    }
    .launchpad-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(52, 54, 61, .22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(52, 54, 61, .22) 1px, transparent 1px),
        #101114;
      background-size: 48px 48px;
    }
    .launchpad-loader__mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #ff6a3d;
      color: #17181b;
      font-size: 25px;
      font-weight: 900;
      animation: launchpad-pulse 900ms ease-in-out infinite alternate;
    }
    @media (prefers-reduced-motion: reduce) {
      .launchpad-loader__mark { animation: none; }
    }
    @keyframes launchpad-pulse {
      from { opacity: .58; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(-2px); }
    }
  </style>
</head>
<body>
  <div class="launchpad-loader" aria-label="Loading LaunchPad administrator console">
    <div class="launchpad-loader__mark" aria-hidden="true">↗</div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      document.querySelector(".launchpad-loader")?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
