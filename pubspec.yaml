name: launchpad_app
description: A localized two-way collaborative networking platform connecting student developers with local businesses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  http: ^1.6.0
  supabase_flutter: ^2.17.2
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  latlong2: ^0.9.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  archive: 4.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/launchpad_mark.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/branding/launchpad_mark.png
  adaptive_icon_background: "#101114"
  adaptive_icon_foreground: assets/branding/launchpad_mark.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/launchpad_mark.png
    background_color: "#101114"
    theme_color: "#FF6A3D"

flutter_native_splash:
  color: "#101114"
  color_dark: "#101114"
  image: assets/branding/launchpad_mark.png
  image_dark: assets/branding/launchpad_mark.png
  android_12:
    color: "#101114"
    color_dark: "#101114"
    image: assets/branding/launchpad_mark.png
    image_dark: assets/branding/launchpad_mark.png
  web: true
